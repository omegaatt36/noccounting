name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs this same gate before it builds an image.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test; empty tests the ref that triggered the run"
        type: string
        default: ""

env:
  TAILWIND_VERSION: v4.2.0

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Tailwind CSS
        run: |
          curl -fsSLO https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss
      - name: Generate code, TypeScript, and CSS
        run: |
          go tool templ generate
          go tool tsgo -p web/ts/tsconfig.json
          tailwindcss -i ./internal/app/webapp/static/input.css -o ./internal/app/webapp/static/output.css --minify
      - name: Test web lifecycle
        run: node --experimental-vm-modules --test web/ts/*.test.mjs
      - run: go test ./... -race -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out
      - run: go vet -all ./...
      - run: go tool golangci-lint run
      - run: go tool govulncheck ./...
