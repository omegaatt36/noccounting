version: "3"

tasks:
  default:
    cmds:
      - task: fmt
      - task: lint
      - task: test

  fmt:
    cmds:
      - go tool golangci-lint fmt
      - go mod tidy

  ts:
    desc: Compile TypeScript with tsgo
    cmds:
      - go tool tsgo -p web/ts/tsconfig.json

  generate:
    cmds:
      - go generate ./...
      - go tool templ generate
      - task ts
      - tailwindcss -i ./internal/app/webapp/static/input.css -o ./internal/app/webapp/static/output.css --minify

  css:
    desc: Build CSS only
    cmds:
      - tailwindcss -i ./internal/app/webapp/static/input.css -o ./internal/app/webapp/static/output.css --minify

  css:watch:
    desc: Watch CSS for changes
    cmds:
      - tailwindcss -i ./internal/app/webapp/static/input.css -o ./internal/app/webapp/static/output.css --watch

  test:
    cmds:
      - go test ./... -race -v

  e2e:
    desc: Browser end-to-end tests alone (needs Chrome, and the generated assets from `task generate`)
    cmds:
      - go test ./test/integration -run TestBrowser -v

  htmx:
    desc: Re-download the vendored htmx (bump the version here, never load it from a CDN)
    cmds:
      - curl -sSfL https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js -o internal/app/webapp/static/htmx.min.js

  build:
    deps: [generate]
    cmds:
      - CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/noccounting ./cmd/noccounting

  run:
    desc: Run noccounting locally (loads .env)
    dotenv: [".env"]
    cmds:
      - go run ./cmd/noccounting

  lint:
    cmds:
      - go tool golangci-lint run
